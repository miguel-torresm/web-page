- title: "Illicit Drugs in Colombia: The Limits of Eradication and the Tasks Ahead"
  venue: "Centro de Estudios sobre Seguridad y Drogas (CESED), Universidad de los Andes. Adapted in English as “Colombia’s New, Old Drug Policy: Reviving a Failed Model,” GIGA Focus Latin America, No. 7, 2026."
  authors: "Juan David Gélvez, Eduard F. Martínez, and <b>Miguel Angel Torres-Montoya</b>"
  description: "Examines the cocaine value chain from coca leaf to the European retail market, showing why eradication targets the lowest-value, most easily replaceable link."
