- title: "Quarterly Monitoring of Economic Activity in Bogotá with Satellite and Mobility Data"
  venue: "Cuadernos de Desarrollo Económico No. 83, Secretaría de Desarrollo Económico, Alcaldía Mayor de Bogotá. February 2026."
  authors: "Eduard F. Martínez-González and <b>Miguel Angel Torres-Montoya</b>"
  description: "Quarterly GDP estimation at the 450 m grid level using VIIRS night lights, TransMilenio mobility, and census data; a feedforward neural network trained on about 16,000 model configurations with rolling-origin validation."
