- title: "The Gender of Justice: Judges and Sentencing Disparities in Colombia"
  authors: "With Eduard F. Martínez and Daniel Mejía. Undergraduate thesis."
  description: "Causally identifies the effect of judge sex on sentence length using institutional random assignment (SARJ) across 24 Colombian judicial districts."
- title: "State Capacity and Education Policy Implementation in Colombia"
  authors: "Work in progress."
  description: "Staggered difference-in-differences design; examines whether local institutional capacity shapes the effect of the full-school-day reform on dropout."
- title: "Impact Evaluation of a Household-Based Poverty Reduction Program in Southwestern Colombia"
  authors: "With Eduard F. Martínez-González and Blanca Zuluaga. CIENFI, Universidad Icesi (consulting project for Fundación Carvajal)."
  description: "Fuzzy regression discontinuity design combining administrative records with a new endline survey (fall 2026). Role: day-to-day project management, data processing, estimation, and results."
