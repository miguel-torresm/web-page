{%- if include.links -%}
<div class="links">
  {%- for l in include.links -%}
  {%- if l.href contains '://' -%}
  <a href="{{ l.href }}">{% include icon.html name="external" %}{{ l.label }}</a>
  {%- else -%}
  <a href="{{ l.href | relative_url }}">{% include icon.html name="file" %}{{ l.label }}</a>
  {%- endif -%}
  {%- endfor -%}
</div>
{%- endif -%}
